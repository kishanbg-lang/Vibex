<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications – FINDIT</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .notif-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      transition: all 0.25s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .notif-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .notif-unread {
      border-left: 4px solid var(--primary);
      background: #ffffff;
    }
    .notif-read {
      background: #f8fafc;
      opacity: 0.82;
    }
    .notif-dismiss-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.15rem;
      line-height: 1;
      padding: 0.25rem 0.45rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .notif-dismiss-btn:hover {
      color: #ef4444;
      background: #fee2e2;
    }
    .notif-filter-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .notif-tab {
      background: #fff;
      border: 1px solid var(--border);
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }
    .notif-tab:hover {
      border-color: #cbd5e1;
      color: var(--text-main);
    }
    .notif-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>

  <main class="main-content">
    <div class="section-header">
      <div>
        <h1 class="section-title">🔔 Campus Recovery Alerts</h1>
        <p style="font-size:0.88rem; color:var(--text-muted);">
          Real-time updates on AI item matches, submitted claims, and recovery handovers.
        </p>
      </div>
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
        <button class="btn btn-sm btn-outline" id="btnMarkAllRead" onclick="markAllAsRead()">
          ✓ Mark All as Read
        </button>
        <button class="btn btn-sm btn-outline" id="btnClearAll" onclick="clearAllNotifications()" style="color:#dc2626; border-color:#fca5a5;">
          🗑️ Clear All
        </button>
      </div>
    </div>

    <div style="max-width:760px; margin:0 auto;">
      <!-- Filter Tabs -->
      <div class="notif-filter-tabs">
        <button class="notif-tab active" id="tabAll" onclick="setNotifFilter('all')">
          All Alerts (<span id="countAll">0</span>)
        </button>
        <button class="notif-tab" id="tabUnread" onclick="setNotifFilter('unread')">
          Unread (<span id="countUnread">0</span>)
        </button>
      </div>

      <!-- Notification Cards List -->
      <div id="notificationsContainer">
        <div style="text-align:center; padding:3rem; color:var(--text-muted);">
          Loading notifications...
        </div>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    let allNotifications = [];
    let currentFilter = 'all';

    async function loadNotificationsPage() {
      const container = document.getElementById('notificationsContainer');
      if (!currentUser) {
        showToast('Please log in to view notifications', 'error');
        setTimeout(() => { window.location.href = '/login.html'; }, 1000);
        return;
      }

      try {
        const res = await fetch('/api/notifications');
        const data = await res.json();
        allNotifications = data.notifications || [];

        const unreadCount = allNotifications.filter(n => !n.is_read).length;
        document.getElementById('countAll').textContent = allNotifications.length;
        document.getElementById('countUnread').textContent = unreadCount;

        // Toggle buttons state
        const btnClear = document.getElementById('btnClearAll');
        const btnMark = document.getElementById('btnMarkAllRead');
        if (btnClear) btnClear.style.display = allNotifications.length > 0 ? 'inline-flex' : 'none';
        if (btnMark) btnMark.style.display = unreadCount > 0 ? 'inline-flex' : 'none';

        renderNotifications();
      } catch (err) {
        container.innerHTML = `<div style="text-align:center; color:#ef4444; padding:2rem;">Failed to load alerts.</div>`;
      }
    }

    function setNotifFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.notif-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById(filter === 'all' ? 'tabAll' : 'tabUnread');
      if (activeTab) activeTab.classList.add('active');
      renderNotifications();
    }

    function renderNotifications() {
      const container = document.getElementById('notificationsContainer');
      let filtered = allNotifications;
      if (currentFilter === 'unread') {
        filtered = allNotifications.filter(n => !n.is_read);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:3.5rem; background:#fff; border-radius:12px; border:1px solid #e2e8f0;">
            <div style="font-size:2.8rem; margin-bottom:0.5rem;">🔕</div>
            <h3>${currentFilter === 'unread' ? 'No unread notifications' : 'No notifications'}</h3>
            <p style="color:#64748b; margin-top:0.35rem; max-width:450px; margin-left:auto; margin-right:auto;">
              ${currentFilter === 'unread' 
                ? 'You have caught up with all your recovery updates!' 
                : 'When an AI match is found or an update occurs on your campus items, alerts will appear here.'}
            </p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:0.75rem;">
          ${filtered.map(n => `
            <div class="notif-card ${n.is_read ? 'notif-read' : 'notif-unread'}" id="notif-${n.id}">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">
                <div style="font-weight:700; font-size:0.98rem; color:var(--text-main); display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap;">
                  ${n.title.includes('match') || n.title.includes('Match') ? '⚡' : (n.title.includes('APPROVED') ? '🎉' : (n.title.includes('Returned') ? '✅' : '📢'))}
                  <span>${escapeHtml(n.title)}</span>
                  ${!n.is_read ? '<span style="background:#dbeafe; color:#1e40af; font-size:0.68rem; font-weight:800; padding:0.15rem 0.45rem; border-radius:9999px;">NEW</span>' : ''}
                </div>

                <div style="display:flex; align-items:center; gap:0.5rem;">
                  <span style="font-size:0.75rem; color:#94a3b8; white-space:nowrap;">
                    ${new Date(n.created_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', month:'short', day:'numeric' })}
                  </span>
                  <button class="notif-dismiss-btn" title="Clear this alert" onclick="deleteSingleNotification(${n.id}, event)">
                    &times;
                  </button>
                </div>
              </div>

              <p style="font-size:0.88rem; color:#475569; line-height:1.45;">${escapeHtml(n.message)}</p>

              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.35rem; flex-wrap:wrap; gap:0.5rem;">
                <div>
                  ${n.link ? `
                    <a href="${n.link}" onclick="markSingleAsRead(${n.id})" class="btn btn-sm btn-outline" style="font-size:0.8rem; padding:0.3rem 0.75rem;">
                      View Details &rarr;
                    </a>
                  ` : ''}
                </div>

                <div>
                  ${!n.is_read ? `
                    <button class="btn btn-sm btn-outline" style="font-size:0.76rem; padding:0.25rem 0.55rem; color:#64748b;" onclick="markSingleAsRead(${n.id})">
                      Mark as Read
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      applyLanguage(currentLang);
    }

    // Clear Single Notification
    async function deleteSingleNotification(id, event) {
      if (event) event.stopPropagation();
      const el = document.getElementById(`notif-${id}`);
      if (el) {
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
      }

      try {
        const res = await fetch(`/api/notifications/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok && data.success) {
          allNotifications = allNotifications.filter(n => n.id !== id);
          showToast('Notification cleared', 'info');
          if (typeof checkNotifications === 'function') checkNotifications();
          setTimeout(() => {
            loadNotificationsPage();
          }, 250);
        } else {
          showToast(data.error || 'Failed to delete notification', 'error');
          loadNotificationsPage();
        }
      } catch (err) {
        showToast('Network error clearing notification', 'error');
        loadNotificationsPage();
      }
    }

    // Clear ALL Notifications
    async function clearAllNotifications() {
      if (allNotifications.length === 0) return;
      if (!confirm('Are you sure you want to clear all notifications?')) return;

      try {
        const res = await fetch('/api/notifications', { method: 'DELETE' });
        const data = await res.json();
        if (res.ok && data.success) {
          allNotifications = [];
          showToast('All notifications cleared successfully', 'success');
          if (typeof checkNotifications === 'function') checkNotifications();
          loadNotificationsPage();
        } else {
          showToast(data.error || 'Failed to clear notifications', 'error');
        }
      } catch (err) {
        showToast('Network error clearing notifications', 'error');
      }
    }

    // Mark Single Notification as Read
    async function markSingleAsRead(id) {
      try {
        await fetch(`/api/notifications/${id}/read`, { method: 'POST' });
        const notif = allNotifications.find(n => n.id === id);
        if (notif) notif.is_read = 1;
        if (typeof checkNotifications === 'function') checkNotifications();
        loadNotificationsPage();
      } catch (e) {}
    }

    // Mark ALL as Read
    async function markAllAsRead() {
      try {
        await fetch('/api/notifications/mark-read', { method: 'POST' });
        showToast('All notifications marked as read', 'info');
        allNotifications.forEach(n => n.is_read = 1);
        if (typeof checkNotifications === 'function') checkNotifications();
        loadNotificationsPage();
      } catch (e) {
        showToast('Error marking read', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(loadNotificationsPage, 250);
    });
  </script>
</body>
</html>
