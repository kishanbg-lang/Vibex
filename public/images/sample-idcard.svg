<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="idBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="lanyardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="idCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="16" fill="url(#idBg)"/>

  <!-- Lanyard Ribbon coming from top -->
  <path d="M 135,-10 L 145,55 L 155,55 L 165,-10" fill="url(#lanyardGrad)" opacity="0.95"/>
  <text x="150" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="6" font-weight="900" text-anchor="middle" letter-spacing="1">COLLEGE TECH</text>

  <!-- Metal Ring & Clip -->
  <circle cx="150" cy="56" r="6" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="146" y="58" width="8" height="14" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>

  <!-- Card Body -->
  <g filter="url(#idCardShadow)">
    <rect x="65" y="68" width="170" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Top Header Banner -->
    <path d="M 65,78 C 65,72 70,68 76,68 L 224,68 C 230,68 235,72 235,78 L 235,96 L 65,96 Z" fill="#1e40af"/>
    <circle cx="80" cy="82" r="6" fill="#facc15"/>
    <text x="92" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800">CAMPUS TECH UNIVERSITY</text>
    <text x="92" y="90" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="5.5">STUDENT IDENTITY CARD</text>

    <!-- Student Photo Box -->
    <rect x="76" y="104" width="42" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <!-- Silhouette Profile -->
    <circle cx="97" cy="122" r="10" fill="#64748b"/>
    <path d="M 82,148 C 82,136 112,136 112,148" fill="#475569"/>

    <!-- EMV Smart Chip -->
    <rect x="126" y="105" width="22" height="17" rx="3" fill="url(#goldChip)" stroke="#a16207" stroke-width="0.75"/>
    <line x1="126" y1="113" x2="148" y2="113" stroke="#854d0e" stroke-width="0.5"/>
    <line x1="137" y1="105" x2="137" y2="122" stroke="#854d0e" stroke-width="0.5"/>

    <!-- Student Details -->
    <text x="154" y="112" fill="#0f172a" font-family="system-ui, sans-serif" font-size="8" font-weight="800">ALEX M.</text>
    <text x="154" y="120" fill="#64748b" font-family="system-ui, sans-serif" font-size="6">DEPT: B.Tech CSE</text>
    <text x="126" y="132" fill="#0f172a" font-family="monospace" font-size="7" font-weight="700">ROLL: 23CS042</text>
    <text x="126" y="141" fill="#64748b" font-family="system-ui, sans-serif" font-size="5.5">VALID: 2023 - 2027</text>

    <!-- Bottom Barcode & Hologram -->
    <rect x="76" y="162" width="148" height="18" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Barcode lines -->
    <g fill="#1e293b">
      <rect x="82" y="166" width="2" height="10"/>
      <rect x="86" y="166" width="3" height="10"/>
      <rect x="91" y="166" width="1" height="10"/>
      <rect x="94" y="166" width="4" height="10"/>
      <rect x="100" y="166" width="2" height="10"/>
      <rect x="104" y="166" width="1" height="10"/>
      <rect x="107" y="166" width="3" height="10"/>
      <rect x="112" y="166" width="2" height="10"/>
      <rect x="116" y="166" width="4" height="10"/>
      <rect x="122" y="166" width="1" height="10"/>
      <rect x="125" y="166" width="2" height="10"/>
      <rect x="129" y="166" width="3" height="10"/>
      <rect x="134" y="166" width="1" height="10"/>
      <rect x="137" y="166" width="2" height="10"/>
    </g>
    <!-- Hologram Seal -->
    <circle cx="210" cy="171" r="6" fill="#38bdf8" opacity="0.6" stroke="#0284c7" stroke-width="0.5"/>
    <text x="210" y="173" fill="#0369a1" font-size="5" font-weight="900" text-anchor="middle">VERIFIED</text>
  </g>
</svg>
