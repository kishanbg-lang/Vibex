<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="elecBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Tablet Metallic Bezel -->
    <linearGradient id="tabBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Tablet Screen Gradient -->
    <linearGradient id="tabScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Screen Glass Glow -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Smartwatch Metallic Body -->
    <linearGradient id="watchBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Powerbank Metallic Surface -->
    <linearGradient id="pbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#elecBgGrad)" />

  <!-- Ambient Grid Patterns -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="80" y1="0" x2="80" y2="300" />
    <line x1="160" y1="0" x2="160" y2="300" />
    <line x1="240" y1="0" x2="240" y2="300" />
    <line x1="320" y1="0" x2="320" y2="300" />
  </g>

  <!-- ITEM 1: TABLET WITH SCREEN (Center Left) -->
  <g filter="url(#softShadow)" transform="translate(60, 40)">
    <!-- Tablet Outer Body -->
    <rect x="0" y="0" width="160" height="220" rx="16" fill="url(#tabBezel)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Screen Inner Display -->
    <rect x="8" y="8" width="144" height="204" rx="10" fill="url(#tabScreen)" />

    <!-- Glass Reflection Diagonal -->
    <path d="M 8 8 L 152 8 L 8 160 Z" fill="url(#screenGlass)" />

    <!-- Front Camera Lens -->
    <circle cx="80" cy="4" r="2" fill="#0f172a" />
    <circle cx="80" cy="4" r="0.8" fill="#38bdf8" />

    <!-- UI Elements on Tablet Screen -->
    <circle cx="80" cy="85" r="28" fill="#ffffff" fill-opacity="0.15" />
    <text x="80" y="92" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">10:45</text>
    <text x="80" y="108" font-family="system-ui, sans-serif" font-size="8" fill="#e2e8f0" text-anchor="middle">Thursday, Oct 24</text>
    
    <!-- App Icons Grid -->
    <g transform="translate(26, 135)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="#38bdf8" />
      <rect x="30" y="0" width="22" height="22" rx="6" fill="#10b981" />
      <rect x="60" y="0" width="22" height="22" rx="6" fill="#f59e0b" />
      <rect x="90" y="0" width="22" height="22" rx="6" fill="#ec4899" />
    </g>

    <!-- Stylus Pen Next to Tablet -->
    <g transform="translate(-18, 30) rotate(-5)">
      <rect x="0" y="0" width="7" height="150" rx="3.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <polygon points="0,150 7,150 3.5,164" fill="#334155" />
      <circle cx="3.5" cy="163" r="1" fill="#0f172a" />
      <line x1="0" y1="20" x2="7" y2="20" stroke="#94a3b8" stroke-width="1" />
    </g>
  </g>

  <!-- ITEM 2: SLIM POWERBANK / ADAPTER (Bottom Right) -->
  <g filter="url(#softShadow)" transform="translate(245, 140)">
    <rect x="0" y="0" width="105" height="120" rx="12" fill="url(#pbGrad)" stroke="#64748b" stroke-width="1" />
    
    <!-- USB Ports on top -->
    <rect x="18" y="12" width="22" height="7" rx="1.5" fill="#0f172a" stroke="#475569" stroke-width="0.8" />
    <rect x="48" y="12" width="22" height="7" rx="1.5" fill="#0f172a" stroke="#475569" stroke-width="0.8" />
    <rect x="78" y="13.5" width="12" height="4" rx="1.5" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />

    <!-- Battery Capacity LED Indicator -->
    <g transform="translate(22, 95)">
      <circle cx="0" cy="0" r="2.5" fill="#38bdf8" />
      <circle cx="10" cy="0" r="2.5" fill="#38bdf8" />
      <circle cx="20" cy="0" r="2.5" fill="#38bdf8" />
      <circle cx="30" cy="0" r="2.5" fill="#64748b" />
      <text x="40" y="3" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#94a3b8">10000mAh</text>
    </g>

    <!-- Branding Emboss -->
    <text x="52" y="58" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="1">FAST CHARGE</text>
  </g>

  <!-- ITEM 3: SMARTWATCH (Top Right) -->
  <g filter="url(#softShadow)" transform="translate(265, 30)">
    <!-- Watch Straps (Silicon Dark Grey) -->
    <rect x="16" y="0" width="38" height="25" rx="4" fill="#1e293b" />
    <rect x="16" y="85" width="38" height="25" rx="4" fill="#1e293b" />

    <!-- Watch Body (Curved Square) -->
    <rect x="0" y="18" width="70" height="74" rx="20" fill="url(#watchBody)" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- OLED Bezel & Display -->
    <rect x="6" y="24" width="58" height="62" rx="14" fill="#000000" />

    <!-- Watch UI Activity Rings & Clock -->
    <circle cx="35" cy="55" r="22" fill="none" stroke="#334155" stroke-width="4" />
    <circle cx="35" cy="55" r="22" fill="none" stroke="#ec4899" stroke-width="4" stroke-dasharray="110 30" />
    <circle cx="35" cy="55" r="16" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="80 20" />
    <circle cx="35" cy="55" r="10" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="45 20" />

    <text x="35" y="58" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">10:45</text>

    <!-- Rotating Crown Button -->
    <rect x="69" y="38" width="4" height="14" rx="2" fill="#94a3b8" />
  </g>
</svg>

