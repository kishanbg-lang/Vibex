<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean Study Desk -->
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Spiral Notebook Cover -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Notebook Pages Side -->
    <linearGradient id="paperPages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Transparent Acrylic Ruler -->
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.6" />
    </linearGradient>

    <!-- Highlighter Neon -->
    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Metallic Compass -->
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="bookShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#statBg)" />

  <!-- Wood Grain / Desk subtle lines -->
  <line x1="0" y1="90" x2="400" y2="90" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="8 12" opacity="0.5" />
  <line x1="0" y1="210" x2="400" y2="210" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="14 18" opacity="0.5" />

  <!-- ITEM 1: SPIRAL NOTEBOOK (Left Side) -->
  <g filter="url(#bookShadow)" transform="translate(60, 35)">
    <!-- Book Pages Stack -->
    <rect x="22" y="10" width="168" height="230" rx="8" fill="url(#paperPages)" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Paper page lines preview -->
    <line x1="38" y1="45" x2="175" y2="45" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="38" y1="65" x2="175" y2="65" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="38" y1="85" x2="175" y2="85" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="38" y1="105" x2="175" y2="105" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="38" y1="125" x2="175" y2="125" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="38" y1="145" x2="175" y2="145" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="38" y1="165" x2="175" y2="165" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="38" y1="185" x2="175" y2="185" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="38" y1="205" x2="175" y2="205" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="38" y1="225" x2="175" y2="225" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Notebook Front Cover (Slightly smaller offset to show paper) -->
    <rect x="24" y="8" width="164" height="230" rx="6" fill="url(#bookCover)" opacity="0.95" />

    <!-- Title Label on Cover -->
    <rect x="50" y="40" width="112" height="60" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="106" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#0369a1" text-anchor="middle">CAMPUS NOTES</text>
    <line x1="65" y1="74" x2="147" y2="74" stroke="#94a3b8" stroke-width="1" />
    <line x1="65" y1="86" x2="147" y2="86" stroke="#94a3b8" stroke-width="1" />

    <!-- Spiral Coil Rings -->
    <g fill="#475569" stroke="#1e293b" stroke-width="1">
      <ellipse cx="22" cy="22" rx="7" ry="4" />
      <ellipse cx="22" cy="42" rx="7" ry="4" />
      <ellipse cx="22" cy="62" rx="7" ry="4" />
      <ellipse cx="22" cy="82" rx="7" ry="4" />
      <ellipse cx="22" cy="102" rx="7" ry="4" />
      <ellipse cx="22" cy="122" rx="7" ry="4" />
      <ellipse cx="22" cy="142" rx="7" ry="4" />
      <ellipse cx="22" cy="162" rx="7" ry="4" />
      <ellipse cx="22" cy="182" rx="7" ry="4" />
      <ellipse cx="22" cy="202" rx="7" ry="4" />
      <ellipse cx="22" cy="222" rx="7" ry="4" />
    </g>
  </g>

  <!-- ITEM 2: ACRYLIC 15CM DRAFTING RULER (Diagonal across bottom) -->
  <g filter="url(#bookShadow)" transform="translate(195, 220) rotate(-18)">
    <rect x="0" y="0" width="180" height="34" rx="3" fill="url(#rulerGrad)" stroke="#38bdf8" stroke-width="1" />
    
    <!-- Millimeter and Centimeter tick marks -->
    <g stroke="#0369a1" stroke-width="1">
      <line x1="10" y1="0" x2="10" y2="14" stroke-width="1.5" />
      <line x1="20" y1="0" x2="20" y2="7" />
      <line x1="30" y1="0" x2="30" y2="7" />
      <line x1="40" y1="0" x2="40" y2="10" />
      <line x1="50" y1="0" x2="50" y2="14" stroke-width="1.5" />
      <line x1="60" y1="0" x2="60" y2="7" />
      <line x1="70" y1="0" x2="70" y2="7" />
      <line x1="80" y1="0" x2="80" y2="10" />
      <line x1="90" y1="0" x2="90" y2="14" stroke-width="1.5" />
      <line x1="100" y1="0" x2="100" y2="7" />
      <line x1="110" y1="0" x2="110" y2="7" />
      <line x1="120" y1="0" x2="120" y2="10" />
      <line x1="130" y1="0" x2="130" y2="14" stroke-width="1.5" />
      <line x1="140" y1="0" x2="140" y2="7" />
      <line x1="150" y1="0" x2="150" y2="7" />
      <line x1="160" y1="0" x2="160" y2="10" />
      <line x1="170" y1="0" x2="170" y2="14" stroke-width="1.5" />
    </g>

    <!-- Numbers -->
    <text x="10" y="24" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#0369a1" text-anchor="middle">0</text>
    <text x="50" y="24" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#0369a1" text-anchor="middle">5</text>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#0369a1" text-anchor="middle">10</text>
    <text x="130" y="24" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#0369a1" text-anchor="middle">15</text>
    <text x="170" y="24" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#0369a1" text-anchor="middle">20</text>
  </g>

  <!-- ITEM 3: GEL PEN & HIGHLIGHTER (Top Right) -->
  <g filter="url(#bookShadow)" transform="translate(255, 30)">
    <!-- Gel Pen (Navy Blue & Silver Clip) -->
    <g transform="rotate(15)">
      <rect x="0" y="0" width="10" height="150" rx="5" fill="#1e3a8a" stroke="#172554" stroke-width="1" />
      <polygon points="0,150 10,150 5,166" fill="#94a3b8" />
      <circle cx="5" cy="165" r="1" fill="#0f172a" />
      <!-- Metallic Pen Clip -->
      <rect x="2" y="10" width="6" height="40" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8" />
      <!-- Rubber Grip Rings -->
      <line x1="0" y1="120" x2="10" y2="120" stroke="#0f172a" stroke-width="1.5" />
      <line x1="0" y1="126" x2="10" y2="126" stroke="#0f172a" stroke-width="1.5" />
      <line x1="0" y1="132" x2="10" y2="132" stroke="#0f172a" stroke-width="1.5" />
    </g>

    <!-- Pastel Highlighter (Neon Yellow) -->
    <g transform="translate(45, 10) rotate(12)">
      <rect x="0" y="0" width="18" height="110" rx="6" fill="url(#neonYellow)" stroke="#ca8a04" stroke-width="1" />
      <polygon points="2,110 16,110 14,124 4,124" fill="#fef08a" />
      <!-- Chisel Tip -->
      <polygon points="4,124 14,124 10,135 6,135" fill="#eab308" />
      <!-- Cap Line -->
      <rect x="0" y="25" width="18" height="3" fill="#ca8a04" />
      <text x="9" y="70" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#854d0e" text-anchor="middle" transform="rotate(-90 9 70)">PASTEL GLOW</text>
    </g>
  </g>

  <!-- ITEM 4: GEOMETRY COMPASS (Top Center Right) -->
  <g filter="url(#bookShadow)" transform="translate(260, 150) rotate(-35)">
    <!-- Compass Top Pivot Knob -->
    <circle cx="20" cy="10" r="5" fill="#334155" />
    <rect x="18" y="0" width="4" height="10" fill="#64748b" />

    <!-- Left Leg (Needle) -->
    <polygon points="17,12 19,12 8,75 7,75" fill="url(#metalSilver)" stroke="#475569" stroke-width="0.5" />
    <polygon points="7,75 8,75 7.5,88" fill="#0f172a" />

    <!-- Right Leg (Pencil Holder) -->
    <polygon points="21,12 23,12 34,70 32,70" fill="url(#metalSilver)" stroke="#475569" stroke-width="0.5" />
    <!-- Tightening Screw -->
    <rect x="29" y="45" width="8" height="4" rx="1.5" fill="#ca8a04" />
    <!-- Attached Mini Pencil -->
    <rect x="33" y="60" width="6" height="35" rx="2" fill="#ef4444" />
    <polygon points="33,95 39,95 36,105" fill="#fed7aa" />
    <polygon points="35,102 37,102 36,105" fill="#0f172a" />
  </g>
</svg>

