<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bagMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bagFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="bagShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="16" fill="url(#bagBg)"/>
  <circle cx="150" cy="125" r="92" fill="#e2e8f0" opacity="0.6"/>

  <g filter="url(#bagShadow)">
    <!-- Top Grab Handle -->
    <path d="M 125,45 C 125,25 175,25 175,45" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- Padded Shoulder Straps (visible in background) -->
    <path d="M 100,55 C 75,70 70,160 88,195" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
    <path d="M 200,55 C 225,70 230,160 212,195" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>

    <!-- Main Backpack Body -->
    <path d="M 100,60 C 100,45 200,45 200,60 L 210,180 C 210,195 200,205 185,205 L 115,205 C 100,205 90,195 90,180 Z" fill="url(#bagMain)" stroke="#475569" stroke-width="2"/>

    <!-- Top Zipper Curve -->
    <path d="M 105,65 Q 150,55 195,65" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="3,2"/>

    <!-- Secondary Laptop Compartment Zipper -->
    <path d="M 102,88 Q 150,78 198,88" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="3,2"/>

    <!-- Front Pocket Panel -->
    <rect x="105" y="102" width="90" height="85" rx="10" fill="url(#bagFront)" stroke="#475569" stroke-width="1.5"/>
    <!-- Front Pocket Zipper with Pull Tag -->
    <line x1="112" y1="114" x2="188" y2="114" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="3,2"/>
    <rect x="160" y="112" width="6" height="10" rx="1.5" fill="#f59e0b"/> <!-- Zipper pull tab -->

    <!-- Brand Emblem -->
    <circle cx="150" cy="145" r="10" fill="#2563eb"/>
    <path d="M 145,145 L 150,138 L 155,145 L 152,145 L 152,151 L 148,151 L 148,145 Z" fill="#ffffff"/>

    <!-- Side Bottle Pocket (Right side) -->
    <path d="M 208,125 Q 224,130 220,180 L 208,175 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- Mini bottle silhouette inside pocket -->
    <rect x="210" y="110" width="10" height="25" rx="2" fill="#0284c7" opacity="0.85"/>

    <!-- Bottom Reinforced Base -->
    <path d="M 92,185 L 208,185 C 208,198 198,205 185,205 L 115,205 C 102,205 92,198 92,185 Z" fill="#020617"/>
  </g>
</svg>
