<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="botBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="steelBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="botShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="16" fill="url(#botBg)"/>
  <circle cx="150" cy="120" r="90" fill="#e0f2fe" opacity="0.6"/>

  <g filter="url(#botShadow)">
    <!-- Carry Strap -->
    <path d="M 130,22 C 130,10 170,10 170,22" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Bottle Cap Top -->
    <rect x="134" y="22" width="32" height="14" rx="3" fill="url(#capGrad)" stroke="#334155" stroke-width="1"/>
    <!-- Silicone Grip Ring -->
    <rect x="132" y="36" width="36" height="8" rx="2" fill="#0284c7"/>

    <!-- Neck Transition -->
    <path d="M 136,44 L 164,44 L 174,62 L 126,62 Z" fill="url(#steelBody)"/>

    <!-- Main Insulated Cylinder Body -->
    <rect x="124" y="62" width="52" height="145" rx="8" fill="url(#steelBody)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Stainless steel highlight shine line -->
    <line x1="145" y1="64" x2="145" y2="204" stroke="#ffffff" stroke-width="3" opacity="0.75"/>
    <line x1="150" y1="64" x2="150" y2="204" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

    <!-- Brand Typography on Bottle -->
    <g transform="rotate(-90 150 135)">
      <text x="150" y="139" fill="#334155" font-family="system-ui, sans-serif" font-size="8" font-weight="900" letter-spacing="2" text-anchor="middle" opacity="0.8">MILTON THERMOSTEEL</text>
      <text x="150" y="146" fill="#64748b" font-family="system-ui" font-size="5" text-anchor="middle" opacity="0.7">750 ML • HOT &amp; COLD</text>
    </g>

    <!-- Base Rubber Protector -->
    <path d="M 124,198 C 124,198 126,208 134,208 L 166,208 C 174,208 176,198 176,198 Z" fill="#0284c7"/>

    <!-- Condensation Water Drops -->
    <ellipse cx="160" cy="85" rx="1.5" ry="2.5" fill="#38bdf8" opacity="0.8"/>
    <ellipse cx="138" cy="115" rx="1.8" ry="3" fill="#38bdf8" opacity="0.8"/>
    <ellipse cx="162" cy="165" rx="2" ry="3.5" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Tag Pill -->
  <rect x="105" y="212" width="90" height="20" rx="10" fill="#0284c7" opacity="0.9"/>
  <text x="150" y="226" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">WATER BOTTLE</text>
</svg>
