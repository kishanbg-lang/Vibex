<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="keyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="brassKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="silverKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="leatherTag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#271004"/>
    </linearGradient>
    <filter id="keyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="16" fill="url(#keyBg)"/>
  <circle cx="140" cy="110" r="85" fill="#fef3c7" opacity="0.4"/>

  <g filter="url(#keyShadow)">
    <!-- Leather Tag with Stitching (Top Right) -->
    <g transform="rotate(35 150 70)">
      <rect x="140" y="30" width="45" height="85" rx="8" fill="url(#leatherTag)" stroke="#92400e" stroke-width="1.5"/>
      <!-- Stitched inner border -->
      <rect x="144" y="34" width="37" height="77" rx="5" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="3,2" opacity="0.8"/>
      <!-- Leather tag logo -->
      <circle cx="162" cy="72" r="10" fill="#92400e" stroke="#f59e0b" stroke-width="1"/>
      <text x="162" y="75" fill="#fef08a" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">RE</text>
    </g>

    <!-- Heavy Steel Split Ring -->
    <circle cx="115" cy="85" r="26" fill="none" stroke="#64748b" stroke-width="6"/>
    <circle cx="115" cy="85" r="26" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Ring split cut line -->
    <line x1="135" y1="75" x2="141" y2="78" stroke="#334155" stroke-width="3"/>

    <!-- Key 1: Bike Ignition Key (Silver, pointing down-right) -->
    <g transform="rotate(25 115 85)">
      <!-- Key Head -->
      <polygon points="105,75 125,75 130,95 100,95" fill="url(#silverKey)" stroke="#475569" stroke-width="1.5"/>
      <circle cx="115" cy="85" r="7" fill="#f8fafc"/>
      <!-- Key Blade with Teeth -->
      <rect x="110" y="95" width="10" height="75" fill="url(#silverKey)" stroke="#475569" stroke-width="1"/>
      <line x1="115" y1="98" x2="115" y2="165" stroke="#334155" stroke-width="1.5"/> <!-- Center groove -->
      <!-- Teeth cuts on right edge -->
      <polygon points="120,120 126,123 120,128" fill="#475569"/>
      <polygon points="120,135 127,139 120,144" fill="#475569"/>
      <polygon points="120,152 125,155 120,160" fill="#475569"/>
    </g>

    <!-- Key 2: Brass Hostel Room Key (Pointing down-left) -->
    <g transform="rotate(-30 115 85)">
      <!-- Key Head -->
      <circle cx="115" cy="85" r="18" fill="url(#brassKey)" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="115" cy="85" r="7" fill="#f8fafc"/>
      <!-- Key Blade with Teeth -->
      <rect x="110" y="103" width="10" height="70" fill="url(#brassKey)" stroke="#78350f" stroke-width="1"/>
      <line x1="115" y1="105" x2="115" y2="168" stroke="#78350f" stroke-width="1.5"/>
      <!-- Teeth cuts -->
      <polygon points="120,125 127,129 120,133" fill="#78350f"/>
      <polygon points="120,140 128,145 120,150" fill="#78350f"/>
      <polygon points="120,155 126,158 120,163" fill="#78350f"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="100" y="206" width="100" height="22" rx="11" fill="#78350f" opacity="0.9"/>
  <text x="150" y="221" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">KEYS &amp; FOB</text>
</svg>
